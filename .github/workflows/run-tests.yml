name: Run E2E Tests

on:
  workflow_call:
    inputs:
      runner:
        description: 'Preferred runner (ubuntu-latest or self-hosted)'
        type: string
        default: 'ubuntu-latest'
      base-url:
        description: 'Target base URL'
        type: string
        default: 'https://www.dell.com/en-uk'
    secrets:
      DELL_EMAIL:
        required: true
      DELL_PASSWORD:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  select-runner:
    name: "Select Runner"
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick available runner
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.runner }}
        run: |
          FALLBACK=$( [ "$REQUESTED" = "self-hosted" ] && echo "ubuntu-latest" || echo "self-hosted" )

          echo "Preferred runner: $REQUESTED — checking availability (up to 60s)..."

          # Listing runners requires admin scope. If the token lacks it (e.g. default
          # GITHUB_TOKEN), we fall back gracefully. In production use a GitHub App token
          # stored as RUNNERS_TOKEN secret with the 'Administration: read' permission.

          for i in $(seq 1 6); do
            IDLE=$(gh api repos/${{ github.repository }}/actions/runners \
              --jq "[.runners[] | select(.labels[].name == \"$REQUESTED\") | select(.status == \"online\") | select(.busy == false)] | length" \
              2>/dev/null || echo "-1")

            if [ "$IDLE" = "-1" ]; then
              echo "Runner API not accessible — using requested runner '$REQUESTED' directly."
              echo "runner=$REQUESTED" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$IDLE" -gt "0" ]; then
              echo "runner=$REQUESTED" >> $GITHUB_OUTPUT
              echo "Runner '$REQUESTED' is available (found after $((($i - 1) * 10))s)."
              exit 0
            fi

            echo "No idle '$REQUESTED' runner found. Waiting 10s... ($i/6)"
            sleep 10
          done

          echo "runner=$FALLBACK" >> $GITHUB_OUTPUT
          echo "Timed out after 60s. Falling back to '$FALLBACK'."

  test:
    name: "Test: ${{ matrix.test }}"
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        test:
          - 01-homepage
          - 02-navigation
          - 03-search
          - 04-search-results-filter
          - 05-product-listing
          - 06-product-detail
          - 07-add-to-cart
          - 08-cart-page
          - 09-cookie-consent
          - 10-login
          - 11-account-dashboard
          - 12-order-history
          - 13-breadcrumbs
          - 14-product-gallery
          - 15-404-handling

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run test
        run: npx playwright test tests/${{ matrix.test }}.spec.ts
        env:
          BASE_URL: ${{ inputs.base-url }}
          DELL_EMAIL: ${{ secrets.DELL_EMAIL }}
          DELL_PASSWORD: ${{ secrets.DELL_PASSWORD }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.test }}
          path: blob-report/
          retention-days: 1

  report:
    name: "Publish Report"
    runs-on: ubuntu-latest
    needs: [select-runner, test]
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Write job summary
        run: |
          echo "## Dell E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Preferred runner | \`${{ inputs.runner }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actual runner | \`${{ needs.select-runner.outputs.runner }}\` (15 parallel jobs) |" >> $GITHUB_STEP_SUMMARY
          echo "| Target URL | ${{ inputs.base-url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full HTML Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: "Slack Notification"
    runs-on: ubuntu-latest
    needs: [select-runner, test, report]
    if: always() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main'

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Dell E2E Tests failed on `${{ github.ref_name }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Dell E2E Tests Failed*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nRunner: `${{ needs.select-runner.outputs.runner }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
