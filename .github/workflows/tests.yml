name: Dell E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'   # Daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner type'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest
      base-url:
        description: 'Target base URL'
        type: string
        default: 'https://www.dell.com/en-uk'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run:
    uses: ./.github/workflows/run-tests.yml
    with:
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      base-url: ${{ inputs.base-url || 'https://www.dell.com/en-uk' }}
    secrets:
      DELL_EMAIL: ${{ secrets.DELL_EMAIL }}
      DELL_PASSWORD: ${{ secrets.DELL_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
