name: Dell E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'   # Daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner type'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest
      base-url:
        description: 'Target base URL'
        type: string
        default: 'https://www.dell.com/en-uk'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Containerised run: uses the official Playwright Docker image.
  # No browser install needed — the image ships with Chromium pre-installed.
  # Used for GitHub-hosted runners and any runner with Docker available.
  run-docker:
    if: ${{ inputs.runner != 'self-hosted' }}
    uses: ./.github/workflows/run-tests-docker.yml
    with:
      base-url: ${{ inputs.base-url || 'https://www.dell.com/en-uk' }}
    secrets:
      DELL_EMAIL: ${{ secrets.DELL_EMAIL }}
      DELL_PASSWORD: ${{ secrets.DELL_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Self-hosted run: installs browsers on the runner with caching.
  # Used for internal VMs where Docker may not be available.
  run-self-hosted:
    if: ${{ inputs.runner == 'self-hosted' }}
    uses: ./.github/workflows/run-tests.yml
    with:
      runner: self-hosted
      base-url: ${{ inputs.base-url || 'https://www.dell.com/en-uk' }}
    secrets:
      DELL_EMAIL: ${{ secrets.DELL_EMAIL }}
      DELL_PASSWORD: ${{ secrets.DELL_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
